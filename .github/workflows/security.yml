name: Security Scan

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run security scan (local composite action)
        uses: ./.github/actions/security-scan
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: frontend-strwaberry
          fail-severity: CRITICAL
